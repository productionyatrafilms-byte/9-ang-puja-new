<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Aangi Puja</title>
    <link rel="stylesheet" href="./assets/plugins/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/theme.css">
    <link rel="stylesheet" href="./assets/css/index.css">
</head>

<body id="body">

    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <img class="page-bg" src="./assets/images/bg.png" alt="">

    <div class="main-container">
        <div class="stage is-intro" data-step="0" data-ang="1">
            <img class="stage-spacer" src="./assets/images/stage-spacer.png" alt="">

            <div class="sky-band"></div>

            <img class="flower flower-copia8" src="./assets/images/flower-copia8.png" alt="">

            <div class="mahaveer">
                <img class="mahaveer-star" src="./assets/images/star.png" alt="">
                <img class="mahaveer-reflection" src="./assets/images/mahaveer.png" alt="">
                <img class="mahaveer-statue" src="./assets/images/mahaveer.png" alt="Tirthankar Parmatma seated in meditation">
                <button class="ang-dot ang-dot-knee-right" type="button" data-dot="knee-right" aria-label="Right knee"></button>
                <button class="ang-dot ang-dot-knee-left" type="button" data-dot="knee-left" aria-label="Left knee"></button>
                <button class="ang-dot ang-dot-toe-left" type="button" data-dot="toe-left" aria-label="Left toe"></button>
                <button class="ang-dot ang-dot-toe-right" type="button" data-dot="toe-right" aria-label="Right toe"></button>
                <button class="ang-dot ang-dot-forearm-right" type="button" data-dot="forearm-right" aria-label="Right forearm"></button>
                <button class="ang-dot ang-dot-forearm-left" type="button" data-dot="forearm-left" aria-label="Left forearm"></button>
                <button class="ang-dot ang-dot-navel" type="button" data-dot="navel" aria-label="Navel"></button>
                <button class="ang-dot ang-dot-heart" type="button" data-dot="heart" aria-label="Heart"></button>
                <button class="ang-dot ang-dot-throat" type="button" data-dot="throat" aria-label="Throat"></button>
                <button class="ang-dot ang-dot-shoulder-right" type="button" data-dot="shoulder-right" aria-label="Right shoulder"></button>
                <button class="ang-dot ang-dot-shoulder-left" type="button" data-dot="shoulder-left" aria-label="Left shoulder"></button>
                <button class="ang-dot ang-dot-forehead" type="button" data-dot="forehead" aria-label="Forehead"></button>
                <button class="ang-dot ang-dot-shikha" type="button" data-dot="shikha" aria-label="Shikha"></button>
            </div>

            <img class="flower flower-copia7" src="./assets/images/flower-copia7.png" alt="">
            <img class="flower flower-copia1" src="./assets/images/flower-copia8.png" alt="">
            <img class="flower flower-copia5" src="./assets/images/flower-copia8.png" alt="">
            <img class="flower flower-copia6" src="./assets/images/flower-copia7.png" alt="">
            <img class="flower flower-copia3" src="./assets/images/flower-copia8.png" alt="">

            <p class="intro-word intro-word-nav" data-text="intro.nav"></p>
            <p class="intro-word intro-word-aangi" data-text="intro.aangi"></p>
            <p class="intro-word intro-word-puja" data-text="intro.puja"></p>

            <img class="flower flower-copia4" src="./assets/images/flower-copia8.png" alt="">
            <img class="flower flower-copia2" src="./assets/images/flower-copia8.png" alt="">

            <button class="back-btn" type="button" aria-label="Back"><img src="./assets/images/back.png" alt=""></button>
            <button class="home-btn" type="button" aria-label="Home"><img src="./assets/images/home.png" alt=""></button>

            <h1 class="title">
                <span class="title-text" data-text="title"></span>
            </h1>

            <div class="intro-box">
                <p class="intro-box-copy" data-text="introBox"></p>
            </div>

            <div class="text-box text-box-left">
                <p class="text-box-copy" data-ang="1" data-text="angs.0.left"></p>
                <p class="text-box-copy" data-ang="2" data-text="angs.1.left"></p>
                <p class="text-box-copy" data-ang="3" data-text="angs.2.left"></p>
                <p class="text-box-copy" data-ang="4" data-text="angs.3.left"></p>
                <p class="text-box-copy" data-ang="5" data-text="angs.4.left"></p>
                <p class="text-box-copy" data-ang="6" data-text="angs.5.left"></p>
                <p class="text-box-copy" data-ang="7" data-text="angs.6.left"></p>
                <p class="text-box-copy" data-ang="8" data-text="angs.7.left"></p>
                <p class="text-box-copy" data-ang="9" data-text="angs.8.left"></p>
            </div>

            <div class="text-box text-box-right">
                <p class="text-box-copy" data-ang="1" data-text="angs.0.right"></p>
                <p class="text-box-copy" data-ang="2" data-text="angs.1.right"></p>
                <p class="text-box-copy" data-ang="3" data-text="angs.2.right"></p>
                <p class="text-box-copy" data-ang="4" data-text="angs.3.right"></p>
                <p class="text-box-copy" data-ang="5" data-text="angs.4.right"></p>
                <p class="text-box-copy" data-ang="6" data-text="angs.5.right"></p>
                <p class="text-box-copy" data-ang="7" data-text="angs.6.right"></p>
                <p class="text-box-copy" data-ang="8" data-text="angs.7.right"></p>
                <p class="text-box-copy" data-ang="9" data-text="angs.8.right"></p>
            </div>

            <div class="verse">
                <p class="verse-copy" data-ang="1" data-text="angs.0.verse"></p>
                <p class="verse-copy" data-ang="2" data-text="angs.1.verse"></p>
                <p class="verse-copy" data-ang="3" data-text="angs.2.verse"></p>
                <p class="verse-copy" data-ang="4" data-text="angs.3.verse"></p>
                <p class="verse-copy" data-ang="5" data-text="angs.4.verse"></p>
                <p class="verse-copy" data-ang="6" data-text="angs.5.verse"></p>
                <p class="verse-copy" data-ang="7" data-text="angs.6.verse"></p>
                <p class="verse-copy" data-ang="8" data-text="angs.7.verse"></p>
                <p class="verse-copy" data-ang="9" data-text="angs.8.verse"></p>
            </div>

            <button class="upsanhar-btn" type="button">
                <span class="pranam-label" data-text="upsanharBtn"></span>
            </button>

            <button class="pranam-btn" type="button">
                <span class="pranam-label" data-text="pranamBtn"></span>
            </button>

            <div class="follow-bubble">
                <img src="./assets/images/follow-bubble.png" alt="">
                <p class="follow-bubble-copy" data-text="followHand"></p>
            </div>

            <div class="hand">
                <img class="hand-point" src="./assets/images/hand.png" alt="">
                <img class="hand-pranam" src="./assets/images/hand2.png" alt="">
            </div>

            <button class="intro-arrow" type="button" aria-label="Start"><img src="./assets/images/arrow.png" alt=""></button>

            <div class="upsanhar-backdrop"></div>
            <div class="upsanhar-modal" role="dialog" aria-modal="true" aria-label="Upsanhar">
                <button class="upsanhar-close" type="button" aria-label="Close">&times;</button>
                <p class="upsanhar-copy" data-text="upsanhar"></p>
            </div>

        </div>
    </div>

    <script src="./assets/plugins/swiper/swiper-bundle.min.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/text.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="./assets/js/index.js"></script>
</body>

</html>
